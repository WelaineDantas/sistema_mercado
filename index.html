<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Adicionada a classe login-page ao container -->
    <div class="container login-page">
        <header class="header">
        </header>

        <main class="main-content">
            <div class="login-container">
                <h1 class="system-title">SISTEMA DE<br>ESTOQUE</h1>

                <div class="login-form">
                    <div class="form-group">
                        <label for="email">Login</label>
                        <input type="email" id="email" placeholder="adm@adm.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password">
                    </div>

                    <button class="btn btn-cadastrar" id="btnCadastrar">Cadastrar</button>
                    <button class="btn btn-entrar" id="btnEntrar">Entrar</button>

                    <a href="recuperar-senha.html" class="recover-link" id="recoverLink">Recuperar senha</a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="sac-icon">SAC</div>
        </footer>
    </div>

    <!-- Modal de cadastrar usuário na tela de login -->
    <div class="modal" id="cadastrarModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cadastrar</h2>
                <button class="btn-close" id="closeCadastrarModal">✖</button>
            </div>
            <div class="divider"></div>
    
            <div class="form-group">
                <label for="nomeUsuario">Nome</label>
                <input type="text" id="nomeUsuario">
            </div>
    
            <div class="form-row"> 
                <div class="form-group">
                    <label for="cpfUsuario">CPF</label>
                    <input type="text" id="cpfUsuario">
                </div>
                <div class="form-group">
                    <label for="emailUsuario">Email</label>
                    <input type="email" id="emailUsuario">
                </div>
            </div>
    
            <div class="form-row"> 
                <div class="form-group">
                    <label for="senhaUsuario">Senha</label>
                    <input type="password" id="senhaUsuario">
                </div>
                <div class="form-group">
                    <label for="funcaoUsuario">Função</label>
                    <input type="text" id="funcaoUsuario">
                </div>
            </div>
    
            <div class="modal-buttons">
                <button class="btn btn-salvar" id="btnSalvarUsuarioCadastro">Salvar</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
