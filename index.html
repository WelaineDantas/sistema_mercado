<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Adicionada a classe login-page ao container -->
    <div class="container login-page">
        <header class="header">
            <div class="login-btn">Login</div>
        </header>

        <main class="main-content">
            <div class="login-container">
                <h1 class="system-title">SISTEMA DE<br>ESTOQUE</h1>

                <div class="login-form">
                    <div class="form-group">
                        <label for="email">Login</label>
                        <input type="email" id="email" placeholder="adm@adm.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password">
                    </div>

                    <button class="btn btn-cadastrar" id="btnCadastrar">Cadastrar</button>
                    <button class="btn btn-entrar" id="btnEntrar">Entrar</button>

                    <a href="#" class="recover-link" id="recoverLink">Recuperar senha</a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="sac-icon">SAC</div>
        </footer>
    </div>

    <!-- Modal de recuperação de senha -->
    <div class="modal" id="recoverModal">
        <div class="modal-content">
            <h2>RECUPERAÇÃO DE SENHA</h2>

            <div class="form-group">
                <label for="cpf">Digite seu CPF</label>
                <input type="text" id="cpf">
            </div>

            <button class="btn btn-confirmar" id="btnConfirmar">Confirmar</button>

            <a href="#" class="return-link" id="returnLogin">
                <span class="arrow-icon">←</span> Retornar para tela de login
            </a>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h2>Nova senha enviada para e-mail cadastrado.</h2>
            <button class="btn btn-confirmar" id="btnReturn">Retornar para tela de login</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
