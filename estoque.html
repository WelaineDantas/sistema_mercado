<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Produtos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal-content {
            text-align: center;
        }
        .btn-confirmar {
            margin-top: 20px;
        }
    </style>
</head>
<script src="script.js"></script>
<body>
    <div class="container">
        <div id="menu-container"></div>               
        <div class="content">
            <div class="content-header">
                <h1>Estoque</h1>
                <button class="btn btn-add" id="btnAddProduto">+ Adicionar item</button>
            </div>

            <div class="content-table">
                <div class="table-header">
                    <div class="col-item">Item</div>
                    <div class="col-quantidade">Quantidade</div>
                    <div class="col-local">Local</div>
                    <div class="col-acoes">Ações</div>
                </div>
                <div class="content-table" id="estoqueLista">
                    <!-- Os produtos cadastrados serão inseridos aqui dinamicamente -->
                </div>

            
        </div>
    </div>

    <!-- Modal de edição de produto -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Produto</h2>
                <button class="btn-close" id="closeEditModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editNome">Nome</label>
                    <input type="text" id="editNome">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editLocal">Local</label>
                        <input type="text" id="editLocal">
                    </div>
                    <div class="form-group">
                        <label for="editPrecoVenda">Preço de venda</label>
                        <input type="text" id="editPrecoVenda">
                    </div>
                </div>
                <button class="btn btn-salvar" id="btnSalvarEdit">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação de exclusão -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h2>Deseja prosseguir com a exclusão?</h2>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="btnConfirmDelete">Sim</button>
                <button class="btn btn-secondary" id="btnCancelDelete">Não</button>
            </div>
        </div>
    </div>

    <!-- Modal de sucesso -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon"></div>
            <h2 id="successMessage">Produto editado com sucesso!</h2>
            <button class="btn btn-confirmar" id="btnSuccessOk">Ok</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
