<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Fornecedores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let fornecedores = JSON.parse(localStorage.getItem("fornecedores")) || [];

            function abrirModalEdicao(index) {
            const fornecedor = fornecedores[index];
            
            document.getElementById("editRazaoSocial").value = fornecedor.razaoSocial;
            document.getElementById("editEndereco").value = fornecedor.endereco;
            document.getElementById("editTelefone").value = fornecedor.telefone;
            document.getElementById("editRepresentante").value = fornecedor.representante;
            document.getElementById("editStatus").value = fornecedor.status; // 🔥 Atualiza o status
            
            document.getElementById("btnSalvarFornecedorEdit").setAttribute("data-id", index);
            document.getElementById("editFornecedorModal").style.display = "flex"; // 🔥 Abre o modal
        }
        document.getElementById("btnAddFornecedor").addEventListener("click", function () {
                window.location.href = "cadastro-fornecedor.html";
            });
document.getElementById("btnSalvarFornecedorEdit").addEventListener("click", function () {
    const index = this.getAttribute("data-id");
    fornecedores[index].razaoSocial = document.getElementById("editRazaoSocial").value;
    fornecedores[index].endereco = document.getElementById("editEndereco").value;
    fornecedores[index].telefone = document.getElementById("editTelefone").value;
    fornecedores[index].representante = document.getElementById("editRepresentante").value;
    fornecedores[index].status = document.getElementById("editStatus").value; // Atualiza o status

    localStorage.setItem("fornecedores", JSON.stringify(fornecedores));
    renderizarFornecedores();
    document.getElementById("editFornecedorModal").style.display = "none";
    document.getElementById("successModal").style.display = "flex";
});

// Fechar o modal de sucesso ao clicar no botão "Ok"
document.getElementById("btnSuccessOk").addEventListener("click", function () {
    document.getElementById("successModal").style.display = "none";
});

document.getElementById("closeEditFornecedorModal").addEventListener("click", function () {
    document.getElementById("editFornecedorModal").style.display = "none";
});

    function renderizarFornecedores() {
        const tabela = document.getElementById("fornecedoresLista");
        tabela.innerHTML = `
            <div class="table-header">
                <div class="col-razao">Razão Social</div>
                <div class="col-cnpj">CNPJ</div>
                <div class="col-representante">Telefone</div>
                <div class="col-acoes">Ações</div>
            </div>
        `;

        fornecedores.forEach((fornecedor, index) => {
            const row = document.createElement("div");
            row.classList.add("table-row");
            row.innerHTML = `
                <div class="row-main">
                    <div class="col-razao">${fornecedor.razaoSocial}</div>
                    <div class="col-cnpj">${fornecedor.cnpj}</div>
                    <div class="col-representante">${fornecedor.telefone}</div>
                    <div class="col-acoes">
                        <button class="btn btn-edit" data-id="${index}">Editar</button>
                        <button class="btn btn-danger" data-id="${index}">Excluir</button>
                    </div>
                </div>
            `;
            tabela.appendChild(row);
        });

        adicionarEventos();
    }

    function adicionarEventos() {
        document.querySelectorAll(".btn-danger").forEach(button => {
            button.addEventListener("click", function () {
                let index = this.getAttribute("data-id");

                // Armazena o índice do fornecedor a ser excluído
                document.getElementById("btnConfirmDelete").setAttribute("data-id", index);

                // Exibe o modal de exclusão
                document.getElementById("deleteModal").style.display = "flex";
            });
        });

       document.querySelectorAll(".btn-edit").forEach(button => {
            button.addEventListener("click", function () {
                let index = this.getAttribute("data-id");
                abrirModalEdicao(index);
            });
        });
    }

     // Confirma a exclusão
     document.getElementById("btnConfirmDelete").addEventListener("click", function () {
        let index = this.getAttribute("data-id");

        // Remove o fornecedor do array
        fornecedores.splice(index, 1);
        
        // Atualiza o localStorage
        localStorage.setItem("fornecedores", JSON.stringify(fornecedores));

        // Recarrega a lista de fornecedores
        renderizarFornecedores();

        // Fecha o modal de exclusão
        document.getElementById("deleteModal").style.display = "none";
    });

    // Cancela a exclusão
    document.getElementById("btnCancelDelete").addEventListener("click", function () {
        document.getElementById("deleteModal").style.display = "none";
    });

        
    

    renderizarFornecedores();
});

    </script>
    <div class="container">
        <div id="menu-container"></div> 
        <div class="content">
            <div class="content-header">
                <h1>Fornecedores</h1>
                <button class="btn btn-add" id="btnAddFornecedor">+ Adicionar</button>
            </div>
            <div class="content-table" id="fornecedoresLista">
                <!-- Fornecedores serão carregados aqui -->
            </div>
        </div>
    </div>

    <!-- Modal de edição de fornecedor -->
<div class="modal" id="editFornecedorModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Editar Fornecedor</h2>
            <button class="btn-close" id="closeEditFornecedorModal">&times;</button>
        </div>
        <div class="divider"></div>
        <div class="modal-body">
            <div class="form-group">
                <label for="editRazaoSocial">Razão Social</label>
                <input type="text" id="editRazaoSocial">
            </div>
            <div class="form-row"> 
                
                <div class="form-group">
                    <label for="editTelefone">Telefone</label>
                    <input type="text" id="editTelefone">
                </div>
                <div class="form-group">
                    <label for="editRepresentante">Representante</label>
                    <input type="text" id="editRepresentante">
                </div>
            </div>
            <div class="form-group">
                <label for="editEndereco">Endereço</label>
                <input type="text" id="editEndereco">
            </div>
            
            
            <div class="form-group">
                <label for="editStatus">Status</label>
                <select id="editStatus">
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>
            <button class="btn btn-salvar" id="btnSalvarFornecedorEdit">Salvar</button>
        </div>
    </div>
</div>

<!-- Modal de sucesso -->
<div class="modal" id="successModal">
    <div class="modal-content">
        <div class="success-icon"></div>
        <h2 id="successMessage">Fornecedor editado com sucesso!</h2>
        <br>
        <button class="btn btn-confirmar" id="btnSuccessOk">Ok</button>
    </div>
</div>

<!-- Modal de confirmação de exclusão -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <h2>Deseja prosseguir com a exclusão?</h2>
        <div class="modal-buttons">
            <button class="btn btn-danger" id="btnConfirmDelete">Sim</button>
            <button class="btn btn-secondary" id="btnCancelDelete">Não</button>
        </div>
    </div>
</div>

</body>
</html>
