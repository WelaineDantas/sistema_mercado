<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>
<body>
    <div class="container">
        <div id="menu-container"></div> 

        <div class="content">
            <div class="content-header">
                <h1>Usuários</h1>
                <button class="btn btn-add" id="btnAddUsuario">+ Adicionar</button>
            </div>

            <div class="content-table">
                <div class="table-header">
                    <div class="col-nome">Nome</div>
                    <div class="col-id">ID</div>
                    <div class="col-funcao">Função</div>
                    <div class="col-acoes">Ações</div>
                </div>

                <div class="table-row">
                    <div class="col-nome">Usuário 1</div>
                    <div class="col-id">0001</div>
                    <div class="col-funcao">Administrador</div>
                    <div class="col-acoes">
                        <button class="btn btn-danger" data-id="1">Excluir</button>
                        <button class="btn btn-edit" data-id="1">Editar</button>
                    </div>
                </div>

                <div class="table-row">
                    <div class="col-nome">Usuário 2</div>
                    <div class="col-id">0002</div>
                    <div class="col-funcao">Estoquista</div>
                    <div class="col-acoes">
                        <button class="btn btn-danger" data-id="2">Excluir</button>
                        <button class="btn btn-edit" data-id="2">Editar</button>
                    </div>
                </div>

                <div class="table-row">
                    <div class="col-nome">Usuário 3</div>
                    <div class="col-id">0003</div>
                    <div class="col-funcao">Gerente</div>
                    <div class="col-acoes">
                        <button class="btn btn-danger" data-id="3">Excluir</button>
                        <button class="btn btn-edit" data-id="3">Editar</button>
                    </div>
                </div>

                <div class="table-row">
                    <div class="col-nome">Usuário 4</div>
                    <div class="col-id">0004</div>
                    <div class="col-funcao">Estoquista</div>
                    <div class="col-acoes">
                        <button class="btn btn-danger" data-id="4">Excluir</button>
                        <button class="btn btn-edit" data-id="4">Editar</button>
                    </div>
                </div>

                <div class="table-row">
                    <div class="col-nome">Usuário 5</div>
                    <div class="col-id">0005</div>
                    <div class="col-funcao">Estoquista</div>
                    <div class="col-acoes">
                        <button class="btn btn-danger" data-id="5">Excluir</button>
                        <button class="btn btn-edit" data-id="5">Editar</button>
                    </div>
                </div>

                <div class="table-row">
                    <div class="col-nome">Usuário 6</div>
                    <div class="col-id">0006</div>
                    <div class="col-funcao">Financeiro</div>
                    <div class="col-acoes">
                        <button class="btn btn-danger" data-id="6">Excluir</button>
                        <button class="btn btn-edit" data-id="6">Editar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de edição de usuário -->
    <div class="modal" id="editUsuarioModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Usuário</h2>
                <button class="btn-close" id="closeEditUsuarioModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editNomeUsuario">Nome</label>
                    <input type="text" id="editNomeUsuario">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editFuncao">Função</label>
                        <input type="text" id="editFuncao">
                    </div>
                    <div class="form-group">
                        <label for="editEmail">Email</label>
                        <input type="email" id="editEmail">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editSenha">Senha</label>
                        <input type="password" id="editSenha">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="status" value="ativo" checked> Ativo
                            </label>
                            <label>
                                <input type="radio" name="status" value="inativo"> Inativo
                            </label>
                        </div>
                    </div>
                </div>
                <button class="btn btn-salvar" id="btnSalvarUsuario">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal de cadastro de usuário -->
    <div class="modal" id="addUsuarioModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cadastrar novo Usuário</h2>
                <button class="btn-close" id="closeAddUsuarioModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="novoNomeUsuario">Nome</label>
                    <input type="text" id="novoNomeUsuario">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="novoCPF">CPF</label>
                        <input type="text" id="novoCPF">
                    </div>
                    <div class="form-group">
                        <label for="novoEmail">Email</label>
                        <input type="email" id="novoEmail">
                    </div>
                    <div class="form-group">
                        <label for="novoFuncao">Função</label>
                        <input type="text" id="novoFuncao">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="novoStatus" value="ativo" checked> Ativo
                            </label>
                            <label>
                                <input type="radio" name="novoStatus" value="inativo"> Inativo
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="novoSenha">Senha</label>
                        <input type="password" id="novoSenha">
                    </div>
                </div>
                <button class="btn btn-salvar" id="btnCadastrarUsuario">SALVAR</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação de exclusão -->
    <div class="modal" id="deleteUsuarioModal">
        <div class="modal-content">
            <h2>Deseja prosseguir com a exclusão?</h2>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="btnConfirmDeleteUsuario">Sim</button>
                <button class="btn btn-secondary" id="btnCancelDeleteUsuario">Não</button>
            </div>
        </div>
    </div>

    <!-- Modal de sucesso -->
    <div class="modal" id="successUsuarioModal">
        <div class="modal-content">
            <div class="success-icon"></div>
            <h2 id="successUsuarioMessage">Usuário editado com sucesso!</h2>
            <button class="btn btn-confirmar" id="btnUsuarioSuccessOk">Ok</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
