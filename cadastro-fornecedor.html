<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Cadastros</title>
    <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>
<body>
    <div class="container">
        <div id="menu-container"></div>   

        <div class="content">
            <div class="content-header">
                <h1>Cadastrar novo Fornecedor</h1>
                <a href="fornecedores.html" class="link-back">Ir para Fornecedores →</a>
            </div>

            <div class="form-container">
                <div class="form-group">
                    <label for="cadastroRazaoSocial">Razão Social</label>
                    <input type="text" id="cadastroRazaoSocial">
                </div>
                
                <div class="form-group">
                    <label for="cadastroCNPJ">CNPJ</label>
                    <input type="text" id="cadastroCNPJ">
                </div>
                
                <div class="form-group">
                    <label for="cadastroTelefone">Telefone</label>
                    <input type="text" id="cadastroTelefone">
                </div>
                
                <div class="form-buttons">
                    <button class="btn btn-salvar" id="btnSalvarCadastro">SALVAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de sucesso -->
    <div class="modal" id="successCadastroModal">
        <div class="modal-content">
            <div class="success-icon"></div>
            <h2>Cadastro realizado com sucesso!</h2>
            <button class="btn btn-confirmar" id="btnCadastroSuccessOk">Ok</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
